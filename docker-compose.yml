services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-resume-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:latest
    container_name: ai-resume-redis
    restart: unless-stopped
    environment:
      REDIS_USER: ${REDIS_DB_USER}
      REDIS_PASSWORD: ${REDIS_DB_PASSWORD}
      REDIS_DB: ${REDIS_DB_NAME}
    volumes:
      - redis_data:/data
      - ./scripts/redis-init.sh:/init.sh:ro
    command: /bin/sh /init.sh
    ports:
      - "${REDIS_DB_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-resume-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_DB_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
